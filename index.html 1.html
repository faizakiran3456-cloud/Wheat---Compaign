html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.count{margin:0 0 10px;color:var(--muted);font-weight:600;min-height:1.5em}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--head);color:var(--head-ink);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:var(--bg2)}
td.y{white-space:nowrap;font-weight:700;color:var(--accent)}
.f{display:inline-block;padding:1px 10px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.f.e{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
mark{background:rgba(255,196,60,.65);color:inherit;border-radius:3px;padding:0 1px}
[hidden]{display:none!important}
</style>

const yr=b=>parseInt(b.year)||0;
BOOKS.sort((a,b)=>yr(b)-yr(a)||a.title.localeCompare(b.title));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase();
function hl(t,terms){let out=esc(t);terms.forEach(w=>{if(!w)return;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');out=out.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'))});return out}
function render(){
  const raw=$('q').value.trim(),q=norm(raw);
  let y1=0,y2=0,terms=[];
  const m=q.match(/^(\d{4})\s*(?:-|to)\s*(\d{4})$/);
  if(m){y1=Math.min(+m[1],+m[2]);y2=Math.max(+m[1],+m[2])}else terms=q.split(/\s+/).filter(Boolean);
  const r=BOOKS.filter(b=>{
    if(y1){const y=yr(b);return y>=y1&&y<=y2}
    const hay=norm([b.title,b.auth,b.year,b.fmt,b.acc].join(' | '));
    return terms.every(t=>hay.includes(t))});
  $('count').textContent=r.length+(r.length===1?' book found':' books found');
  if(!r.length){$('wrap').hidden=true;$('count').textContent=raw?'No book found for "'+raw+'". Try a shorter word or another spelling.':'';return}
  $('body').innerHTML=r.map(b=>`<tr><td>${hl(b.title,terms)}</td><td>${b.auth?hl(b.auth,terms):''}</td><td class="y">${b.year?hl(b.year,terms):'n.d.'}</td><td><span class="f${b.fmt==='E-Book'?' e':''}">${hl(b.fmt,terms)}</span></td></tr>`).join('');
  $('wrap').hidden=false;
}
$('q').addEventListener('input',render);
$('clr').onclick=()=>{$('q').value='';render();$('q').focus()};
render();
